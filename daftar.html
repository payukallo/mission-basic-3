<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Daftar</title>
    <link rel="stylesheet" href="./styles/daftar.css" />
    <link rel="stylesheet" href="./styles/main.css" />
  </head>
  <body>
    <form action="" method="">
      <div class="container">
        <div class="logo">
          <img
            id="logo"
            src="./assets/logo/movie.png"
            width="163px"
            height="44px"
          />
        </div>
        <div class="title">
          <h3 class="heading-3">Daftar</h3>
          <p class="body-medium-regular">Selamat datang!</p>
        </div>
        <div class="userName body-large-medium">
          <label for="newUserName">Username</label>
          <input
            class="body-medium-regular"
            id="newUserName"
            type="text"
            name="newUserName"
            placeholder="Masukkan username"
            required
          />
        </div>
        <div class="password body-large-medium">
          <label for="newPassword">Kata Sandi</label>
          <input
            class="body-medium-regular"
            id="newPassword"
            type="password"
            name="newPassword"
            placeholder="Masukkan kata sandi"
            required
          />
        </div>
        <div class="password-container">
          <div class="password body-large-medium">
            <label for="confirmNewPassword">Konfirmasi Kata Sandi</label>
            <input
              class="body-medium-regular"
              id="confirmNewPassword"
              type="password"
              name="confirmNewPassword"
              placeholder="Masukkan kata sandi"
              required
            />
          </div>
          <div class="account body-medium-regular">
            <span
              >Sudah punya akun?
              <a class="body-medium-medium" href="index.html">Masuk</a></span
            >
          </div>
        </div>
        <div class="login body-medium-semiBold">
          <button class="body-medium-semiBold regis" type="submit">Daftar</button>
          <span class="body-small-medium">Atau</span>

          <button class="google-login body-medium-semiBold">
            <img src="./assets/logo/google.png" width="18px" />
            Daftar dengan Google
          </button>
        </div>
      </div>
    </form>
  </body>
</html>
