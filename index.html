<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link rel="stylesheet" href="./styles/login.css" />
    <link rel="stylesheet" href="./styles/main.css" />
  </head>
  <body>
    <form action="" method="">
      <div class="container">
        <div class="logo">
          <img
            id="logo"
            src="./assets/logo/movie.png"
            width="163px"
            height="44px"
          />
        </div>
        <div class="title">
          <h3 class="heading-3">Masuk</h3>
          <p class="body-medium-regular">Selamat datang kembali</p>
        </div>
        <div class="userName body-large-medium">
          <label for="userName">Username</label>
          <input
            class="body-medium-regular"
            id="userName"
            type="text"
            name="userName"
            placeholder="Masukkan username"
            required
          />
        </div>
        <div class="password-container">
          <div class="password body-large-medium">
            <label for="password">Kata Sandi</label>
            <input
              class="body-medium-regular"
              id="password"
              type="password"
              name="password"
              placeholder="Masukkan kata sandi"
              required
            />
          </div>
          <div class="newAccount body-medium-regular">
            <span
              >Belum punya akun?
              <a class="body-medium-medium" href="daftar.html">Daftar</a></span
            >
            <a href="">Lupa kata sandi?</a>
          </div>
        </div>
        <div class="login">
          <button class="body-medium-semiBold log" type="submit">
            Masuk
          </button>
          <span class="body-small-medium">Atau</span>

          <button class="google-login body-medium-semiBold">
            <img src="./assets/logo/google.png" width="18px" />
            Masuk dengan Google
          </button>
        </div>
      </div>
    </form>
  </body>
</html>
